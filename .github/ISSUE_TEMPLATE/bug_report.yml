name: Bug report
description: Something is broken or behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Started a game against ...
        2. Rolled ...
        3. Expected ..., but ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, game or replay link, bot name — anything that pins it down.
      placeholder: https://play.jc.id.lv/replay/...
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser and OS for the web app; language and library versions for bots.
      placeholder: Firefox 142 on macOS / Java 25, dicechess-bot-runtime 1.0.1
    validations:
      required: false
